# The engine and the agent are built for the same platform: the agent runs
# on the engine host. Every test in this suite drives a program through a
# job factory, and a job factory needs an agent, so unlike the bare template
# this suite has a real one.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# Only the layers the test side needs: this suite drives processes over
# tapi_job and does not craft or capture traffic, so the minimal protocol
# set keeps the agent build small.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# The agent side of the traffic engine takes the same protocol list as the
# test side; without it the build picks the full default set.
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour, started on the engine host.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# RPC servers are served by this application rather than by the agent itself,
# because it links the job library. Every test reads what a command printed,
# which needs the output channels only the RPC job factory has - so without
# this application the suite does not work at all.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
