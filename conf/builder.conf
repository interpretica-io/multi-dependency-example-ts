# Two platforms for one host. The engine and the tests are built for the
# default platform; the Test Agent (it runs on the engine host too) is
# built for its own platform, linux_ta.
#
# Why two: TE builds a library statically for agents only on a platform
# that builds agents, and several tsf-* TAPIs ask for a static copy
# whenever their platform builds agents at all - which cannot link, since
# they depend on the engine-only tapi. Keeping agents off the engine
# platform gives every engine TAPI the shared build it is meant to have.

# --- Engine platform: the engine, the tests and every tsf-* TAPI ---
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             tapi_job tapi_tool])

# Every tsf-* module of the catalog. Their references live in
# conf/external.yml. The order is the dependency order, for a reader:
# tapi_devtool is the base, tapi_kernel builds on it, tapi_cybersec on
# tapi_kernel, and every module that reports findings on tapi_cybersec.
TE_EXT_REPO_USE([tsf_devtool], [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel], [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])
TE_EXT_REPO_USE([tsf_package], [], [tapi_package])
TE_EXT_REPO_USE([tsf_container], [], [tapi_container])
TE_EXT_REPO_USE([tsf_emu], [], [tapi_emu])
TE_EXT_REPO_USE([tsf_time], [], [tapi_time])
TE_EXT_REPO_USE([tsf_fs], [], [tapi_fs])
TE_EXT_REPO_USE([tsf_memorymap], [], [tapi_memmap])
TE_EXT_REPO_USE([tsf_fuzz], [], [tapi_fuzz])
TE_EXT_REPO_USE([tsf_tls], [], [tapi_tls])
TE_EXT_REPO_USE([tsf_http], [], [tapi_http])
TE_EXT_REPO_USE([tsf_mqtt], [], [tapi_mqtt])
TE_EXT_REPO_USE([tsf_smb], [], [tapi_smb])
TE_EXT_REPO_USE([tsf_printing], [], [tapi_print])
TE_EXT_REPO_USE([tsf_cwmp], [], [tapi_cwmp])
TE_EXT_REPO_USE([tsf_bluetooth], [], [tapi_bt])
TE_EXT_REPO_USE([tsf_802154], [], [tapi_802154])
TE_EXT_REPO_USE([tsf_lorawan], [], [tapi_lorawan])
TE_EXT_REPO_USE([tsf_sdr], [], [tapi_sdr])
TE_EXT_REPO_USE([tsf_can], [], [tapi_can])
TE_EXT_REPO_USE([tsf_jtag], [], [tapi_jtag])
TE_EXT_REPO_USE([tsf_flash], [], [tapi_flash])
TE_EXT_REPO_USE([tsf_power], [], [tapi_power])
TE_EXT_REPO_USE([tsf_playwright], [], [tapi_playwright])
TE_EXT_REPO_USE([tsf_ai], [], [tapi_ai])
TE_EXT_REPO_USE([tsf_dummy], [], [tapi_dummy])
# The engine halves of the repositories that also have an agent half.
TE_EXT_REPO_USE([tsf_tunnel], [], [tapi_cfg_vpn])
TE_EXT_REPO_USE([tsf_wifi], [], [tapi_cfg_wifi])
TE_EXT_REPO_USE([tsf_android], [], [tapi_android])
TE_EXT_REPO_USE([tsf_apple], [], [tapi_apple])
TE_EXT_REPO_USE([tsf_appium], [], [tapi_appium])

# The device-control RPCs are described to both sides. The engine platform
# does not build the agent libraries the definitions live in, so it reads
# them from the fetched repositories directly.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,${TE_BUILD}/ext-repos/tsf_android/ta_android/android_rpc.x.m4,${TE_BUILD}/ext-repos/tsf_apple/ta_apple/apple_rpc.x.m4,${TE_BUILD}/ext-repos/tsf_appium/ta_appium/appium_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# Only the layers the tests need: tapi_sniffrules captures TCP and UDP
# over IPv4 and IPv6 on an Ethernet interface.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# --- Agent platform: the Test Agent and its RPC provider ---
TE_PLATFORM_BUILD([linux_ta], [])
TE_PLATFORM([linux_ta], [], [-D_GNU_SOURCE], [-D_GNU_SOURCE], [],
            [logger_core tools conf_oid rpcxdr rpc_types asn ndn \
             comm_net_agent loggerta rpctransport agentlib \
             rcfpch rpcserver tad netconf ta_job rpcs_job \
             tapi_cfg_wifi ta_wifi \
             ta_android ta_android_conf rpcs_android \
             ta_apple ta_apple_conf rpcs_apple \
             ta_appium ta_appium_conf rpcs_appium])

# Configurator-backed repositories register their subtrees through
# TE_RCF_PCH_CONF_EXT(); the device-control repositories add a
# Configurator subtree and RPCs.
#
# tsf-tunnel's agent half is NOT linked: ta_vpn needs a static
# tapi_cfg_vpn, and tapi_cfg_vpn is built shared only
# (build_lib_static = false), so ta_vpn cannot link into any agent. The
# net group reports the missing /agent/vpn subtree as a known issue
# (conf/trc.xml) until tsf-tunnel is fixed.
TE_EXT_REPO_USE([tsf_wifi], [linux_ta], [tapi_cfg_wifi ta_wifi])
TE_EXT_REPO_USE([tsf_android], [linux_ta], [ta_android ta_android_conf rpcs_android])
TE_EXT_REPO_USE([tsf_apple], [linux_ta], [ta_apple ta_apple_conf rpcs_apple])
TE_EXT_REPO_USE([tsf_appium], [linux_ta], [ta_appium ta_appium_conf rpcs_appium])

TE_LIB_PARMS([rpcxdr], [linux_ta], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_android/android_rpc.x.m4,../ta_apple/apple_rpc.x.m4,../ta_appium/appium_rpc.x.m4])

# The agent side of the traffic engine takes the same protocol list as
# the test side; without it the build picks the full default set.
TE_LIB_PARMS([tad], [linux_ta], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour, started on the engine host.
TE_TA_TYPE([linux], [linux_ta], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [],
           [comm_net_agent rcfpch ndn asn \
            tapi_cfg_wifi ta_wifi \
            ta_android ta_android_conf ta_apple ta_apple_conf \
            ta_appium ta_appium_conf])

# tsf-dummy's dummy_agent is not built: an external agent type lands in
# the agents/ tree of its platform only, and that tree is part of the RCF
# consistency hash, so the engine and the agent would disagree and RCF
# would refuse the agent. dummy/greeting skips its agent check for it.

# RPC servers are served by this application rather than by the agent
# itself, because it links the job library. Every test reads what a
# command printed, which needs the output channels only the RPC job
# factory has - so without this application the suite does not work.
TE_TA_APP([ta_rpcprovider], [linux_ta], [linux],
          [ta_rpcprovider], [], [],
          [conf_oid ta_job comm_net_agent rpcs_job \
           rpcs_android ta_android rpcs_apple ta_apple rpcs_appium ta_appium \
           rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8,libcurl,jansson,libimobiledevice-1.0,libplist-2.0'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
