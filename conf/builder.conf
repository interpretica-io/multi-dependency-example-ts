# Two platforms for one host. The engine and the tests are built for the
# default platform; the Test Agent (it runs on the engine host too) is
# built for its own platform, linux_ta.
#
# Why two: TE builds a library statically for agents only on a platform
# that builds agents, and several tsf-* TAPIs ask for a static copy
# whenever their platform builds agents at all - which cannot link, since
# they depend on the engine-only tapi. Keeping agents off the engine
# platform gives every engine TAPI the shared build it is meant to have.

# --- Engine platform: the engine, the tests and every tsf-* TAPI ---
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             tapi_job tapi_tool])

# The tsf-* modules the tests use. Their references live in
# conf/external.yml. The order is the dependency order, for a reader:
# tapi_devtool is the base, tapi_kernel builds on it, tapi_cybersec on
# tapi_kernel, and every module that reports findings on tapi_cybersec.
TE_EXT_REPO_USE([tsf_devtool], [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel], [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])
TE_EXT_REPO_USE([tsf_package], [], [tapi_package])
TE_EXT_REPO_USE([tsf_container], [], [tapi_container])
TE_EXT_REPO_USE([tsf_fs], [], [tapi_fs])
TE_EXT_REPO_USE([tsf_memorymap], [], [tapi_memmap])
TE_EXT_REPO_USE([tsf_fuzz], [], [tapi_fuzz])
TE_EXT_REPO_USE([tsf_http], [], [tapi_http])
TE_EXT_REPO_USE([tsf_playwright], [], [tapi_playwright])

TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# Only the layers the tests need: tapi_sniffrules captures TCP and UDP
# over IPv4 and IPv6 on an Ethernet interface.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# --- Agent platform: the Test Agent and its RPC provider ---
TE_PLATFORM_BUILD([linux_ta], [])
TE_PLATFORM([linux_ta], [], [-D_GNU_SOURCE], [-D_GNU_SOURCE], [],
            [logger_core tools conf_oid rpcxdr rpc_types asn ndn \
             comm_net_agent loggerta rpctransport agentlib \
             rcfpch rpcserver tad netconf ta_job rpcs_job])

TE_LIB_PARMS([rpcxdr], [linux_ta], [],
             [--with-rpcdefs=tarpc_job.x.m4])

# The agent side of the traffic engine takes the same protocol list as
# the test side; without it the build picks the full default set.
TE_LIB_PARMS([tad], [linux_ta], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour, started on the engine host.
TE_TA_TYPE([linux], [linux_ta], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# RPC servers are served by this application rather than by the agent
# itself, because it links the job library. Every test reads what a
# command printed, which needs the output channels only the RPC job
# factory has - so without this application the suite does not work.
TE_TA_APP([ta_rpcprovider], [linux_ta], [linux],
          [ta_rpcprovider], [], [],
          [conf_oid ta_job comm_net_agent rpcs_job \
           rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
