<rcf>
    <!--
      One agent, started on the engine host itself. No host is named, and an
      unnamed host means "here": the agent is launched directly rather than
      over a remote login.

      This suite drives the multi-dependency-example demos and HTTP services
      as programs on this agent, so on localhost the device under test is the
      machine the agent runs on. Point this at another host and the same
      tests exercise the example built there instead.
    -->
    <ta name="Agt_A" type="linux" rcflib="rcfunix">
        <conf name="port">${TE_RCF_PORT:-50000}</conf>
        <conf name="copy_timeout">60</conf>
        <conf name="kill_timeout">30</conf>
    </ta>
</rcf>
